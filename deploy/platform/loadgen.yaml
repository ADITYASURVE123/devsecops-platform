# Synthetic traffic so canary analysis always has data to judge.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: apps
  labels: { app.kubernetes.io/name: loadgen, app.kubernetes.io/part-of: devsecops-platform }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: loadgen }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loadgen, app.kubernetes.io/part-of: devsecops-platform }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 100, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                curl -s -o /dev/null http://orders-api/orders
                curl -s -o /dev/null http://orders-api/orders/1
                curl -s -o /dev/null http://inventory-api/items
                curl -s -o /dev/null http://inventory-api/items/2
                sleep 0.2
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
