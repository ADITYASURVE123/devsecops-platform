apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-rollouts
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  dashboard-rollouts.json: "{\n \"uid\": \"rollouts\",\n \"title\": \"Rollouts & cluster health\",\n \"schemaVersion\": 39,\n \"version\": 1,\n \"refresh\": \"30s\",\n \"time\": {\n  \"from\": \"now-1h\",\n  \"to\": \"now\"\n },\n \"panels\": [\n  {\n   \"id\": 1,\n   \"type\": \"timeseries\",\n   \"title\": \"Rollout phase (1 = current)\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"expr\": \"sum by (name, phase) (rollout_info)\",\n     \"legendFormat\": \"{{name}} {{phase}}\",\n     \"refId\": \"A\"\n    }\n   ]\n  },\n  {\n   \"id\": 2,\n   \"type\": \"timeseries\",\n   \"title\": \"Ready replicas\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 0,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"expr\": \"sum by (deployment, replicaset) (kube_replicaset_status_ready_replicas{namespace=\\\"apps\\\"})\",\n     \"legendFormat\": \"{{replicaset}}\",\n     \"refId\": \"A\"\n    }\n   ]\n  },\n  {\n   \"id\": 3,\n   \"type\": \"timeseries\",\n   \"title\": \"Container restarts (10m)\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 8,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"expr\": \"sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\\\"apps\\\"}[10m]))\",\n     \"legendFormat\": \"{{pod}}\",\n     \"refId\": \"A\"\n    }\n   ]\n  },\n  {\n   \"id\": 4,\n   \"type\": \"timeseries\",\n   \"title\": \"Node memory used\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 8,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"percentunit\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"expr\": \"1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)\",\n     \"legendFormat\": \"{{instance}}\",\n     \"refId\": \"A\"\n    }\n   ]\n  }\n ],\n \"tags\": [\n  \"devsecops-platform\"\n ]\n}"
