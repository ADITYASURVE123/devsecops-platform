apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-jenkins
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  dashboard-jenkins.json: "{\n \"uid\": \"jenkins\",\n \"title\": \"Jenkins builds\",\n \"schemaVersion\": 39,\n \"version\": 1,\n \"refresh\": \"30s\",\n \"time\": {\n  \"from\": \"now-1h\",\n  \"to\": \"now\"\n },\n \"panels\": [\n  {\n   \"id\": 1,\n   \"type\": \"timeseries\",\n   \"title\": \"Successful builds (total)\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 0,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"expr\": \"default_jenkins_builds_success_build_count\",\n     \"legendFormat\": \"{{jenkins_job}}\",\n     \"refId\": \"A\"\n    }\n   ]\n  },\n  {\n   \"id\": 2,\n   \"type\": \"timeseries\",\n   \"title\": \"Failed builds (total)\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 12,\n    \"y\": 0,\n    \"w\": 12,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"short\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"expr\": \"default_jenkins_builds_failed_build_count\",\n     \"legendFormat\": \"{{jenkins_job}}\",\n     \"refId\": \"A\"\n    }\n   ]\n  },\n  {\n   \"id\": 3,\n   \"type\": \"timeseries\",\n   \"title\": \"Last build duration (ms)\",\n   \"datasource\": {\n    \"type\": \"prometheus\",\n    \"uid\": \"prometheus\"\n   },\n   \"gridPos\": {\n    \"x\": 0,\n    \"y\": 8,\n    \"w\": 24,\n    \"h\": 8\n   },\n   \"fieldConfig\": {\n    \"defaults\": {\n     \"unit\": \"ms\"\n    },\n    \"overrides\": []\n   },\n   \"targets\": [\n    {\n     \"expr\": \"default_jenkins_builds_last_build_duration_milliseconds\",\n     \"legendFormat\": \"{{jenkins_job}}\",\n     \"refId\": \"A\"\n    }\n   ]\n  }\n ],\n \"tags\": [\n  \"devsecops-platform\"\n ]\n}"
