# Trimmed for small clusters. Chart version pinned in deploy/argocd/bootstrap/templates/platform.yaml.
fullnameOverride: ""
prometheus:
  prometheusSpec:
    # pick up ServiceMonitors / PrometheusRules from every namespace without a 'release' label
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 3d
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 900Mi }
    # Jenkins (Prometheus metrics plugin). Replace the target; keep it private (VPC / SSM tunnel).
    additionalScrapeConfigs:
      - job_name: jenkins
        metrics_path: /prometheus
        static_configs:
          - targets: ["<JENKINS_PRIVATE_IP>:8080"]
grafana:
  adminPassword: "change-me-locally"     # demo only; use an ExternalSecret outside a local demo
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
alertmanager:
  alertmanagerSpec:
    # mounted at /etc/alertmanager/secrets/alertmanager-slack/ (created by ExternalSecret or by hand)
    secrets: ["alertmanager-slack"]
    resources:
      requests: { cpu: 10m, memory: 32Mi }
  config:
    route:
      receiver: slack
      group_by: [alertname, service]
      group_wait: 30s
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            channel: "#alerts"
            send_resolved: true
            title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}Runbook: {{ .Annotations.runbook }}{{ "\n" }}{{ end }}'
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
# components that are noisy / unreachable on managed EKS and kind
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
